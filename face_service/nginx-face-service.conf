# Nginx reverse proxy for HRMS Face Recognition Sidecar
# Only needed if PHP hosting and VPS are DIFFERENT hosts.
# If same host, PHP calls 127.0.0.1:8000 directly — skip this config.

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=face_api:10m rate=10r/s;

upstream face_backend {
    server 127.0.0.1:8000;
    keepalive 4;
}

server {
    listen 443 ssl http2;
    server_name face.yourdomain.com;  # CHANGE to your actual subdomain

    # SSL — Let's Encrypt via certbot
    ssl_certificate /etc/letsencrypt/live/face.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/face.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max body size for face images (3 frames × ~200KB each)
    client_max_body_size 2M;

    # Timeout for AI inference
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location / {
        limit_req zone=face_api burst=20 nodelay;

        proxy_pass http://face_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass HMAC headers through
        proxy_pass_header X-Signature;
        proxy_pass_header X-Timestamp;
    }

    # Health endpoint — no rate limiting
    location = /health {
        proxy_pass http://face_backend/health;
        proxy_set_header Host $host;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name face.yourdomain.com;
    return 301 https://$host$request_uri;
}
